<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Page Not Found — Arif Iqbal</title>
<link rel="icon" href="favicon.ico" />
<style>
  :root {
    --bg: #1A1818;
    --fg: #E8E4E0;
    --accent: #A4552C;
    --font: 'Onest', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #fff 0%, #857878 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 1.125rem;
    color: rgba(232, 228, 224, 0.7);
    max-width: 32ch;
    line-height: 1.5;
    margin-bottom: 2.5rem;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    height: 3rem;
    padding: 0 1.6rem;
    border-radius: 9999px;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    font-size: 0.9375rem;
    font-weight: 600;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
  }
  a.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
  }
</style>
</head>
<body>
  <h1>404</h1>
  <p>The page you're looking for doesn't exist or has moved behind another door.</p>
  <a class="btn" href="/">← Back to the doors</a>
</body>
</html>
